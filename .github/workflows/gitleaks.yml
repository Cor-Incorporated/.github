name: secret scan (gitleaks)

on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks を取得する
        run: |
          set -eu
          URL=$(curl -sS https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                | grep -o 'https://[^"]*linux_x64\.tar\.gz' | head -1)
          curl -sSL "$URL" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: 検査する
        run: |
          set -eu
          # スキャン範囲をイベント種別で切り替える:
          #   pull_request → ベース(main)との差分のみ（既存の履歴リーク・テストフィクスチャを誤検出しない）
          #   push         → 直前コミットとの差分
          #   schedule     → 月次フルスキャン（定期監査）
          SCAN_ARGS=()
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              BASE_SHA="${GITHUB_EVENT_PULL_REQUEST_BASE_SHA:-}"
              if [ -z "$BASE_SHA" ]; then
                BASE_SHA="$(git merge-base origin/main HEAD 2>/dev/null || true)"
              fi
              if [ -n "$BASE_SHA" ]; then
                SCAN_ARGS=(--log-opts="${BASE_SHA}..HEAD")
                echo "PR 差分をスキャンします: ${BASE_SHA}..HEAD"
              fi
              ;;
            push)
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                SCAN_ARGS=(--log-opts="HEAD^..HEAD")
                echo "直前コミットの差分をスキャンします: HEAD^..HEAD"
              fi
              ;;
            *)
              echo "リポジトリ全体をスキャンします（schedule / workflow_call）"
              ;;
          esac

          if [ -f .gitleaks.toml ]; then
            echo "リポジトリ固有の設定を使用します"
            gitleaks git "${SCAN_ARGS[@]}" . --redact --config .gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif --exit-code 1
          else
            echo "設定ファイルがないため既定ルールで検査します"
            gitleaks git "${SCAN_ARGS[@]}" . --redact \
              --report-format sarif --report-path gitleaks.sarif --exit-code 1
          fi

      - name: 結果を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_number }}
          path: gitleaks.sarif
          retention-days: 90
